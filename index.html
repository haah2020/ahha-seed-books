<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씨앗 · 무기 도서 목록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper: #f0ede1;
    --paper-deep: #e6e1d1;
    --ink: #232b24;
    --ink-soft: #5a6157;
    --line: #c9c2ac;
    --moss: #3f5340;
    --moss-deep: #2b3a2c;
    --gold: #a9803f;
    --gold-soft: #d8c7a1;
    --seed: #4f6b45;
    --weapon: #8a3c2e;
    --life: #6b5490;
    --card-shadow: 2px 3px 0 rgba(35,43,36,0.08);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height:100vh;
  }

  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- Header ---------- */
  header{
    background: var(--moss-deep);
    color: var(--paper);
    padding: 28px 32px 22px;
    border-bottom: 6px solid var(--gold);
  }
  header .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--gold-soft);
    margin: 0 0 6px;
  }
  header h1{
    margin:0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header p.sub{
    margin: 8px 0 0;
    color: #cfd6cc;
    font-size: 14.5px;
    max-width: 640px;
    line-height: 1.5;
  }
  .count-strip{
    display:flex;
    gap: 22px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .count-strip .item{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--gold-soft);
  }
  .count-strip .item b{
    color: #fff;
    font-size: 16px;
    display:block;
    font-family: 'Source Serif 4', serif;
  }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns: 260px 1fr;
    gap: 0;
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* ---------- Drawer (sidebar) ---------- */
  .drawer{
    background: var(--paper-deep);
    border-right: 1px solid var(--line);
    padding: 24px 18px;
    min-height: calc(100vh - 150px);
  }
  .drawer h2{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 12px;
    text-transform: none;
  }
  .cat-btn{
    display:flex;
    justify-content: space-between;
    align-items:center;
    width:100%;
    text-align:left;
    background: none;
    border: none;
    border-bottom: 1px dashed var(--line);
    padding: 10px 4px;
    font-family:'Source Serif 4', serif;
    font-size: 15px;
    color: var(--ink);
    cursor:pointer;
  }
  .cat-btn:hover{ color: var(--moss); }
  .cat-btn.active{
    color: var(--moss-deep);
    font-weight: 700;
  }
  .cat-btn .n{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .tag-filter{
    margin-top: 22px;
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    cursor: pointer;
    color: var(--ink-soft);
  }
  .pill.active-seed{ background: var(--seed); color:#fff; border-color:var(--seed); }
  .pill.active-weapon{ background: var(--weapon); color:#fff; border-color:var(--weapon); }
  .pill.active-life{ background: var(--life); color:#fff; border-color:var(--life); }

  .export-btn{
    margin-top: 26px;
    width: 100%;
    background: none;
    border: 1px solid var(--moss);
    color: var(--moss-deep);
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 10px;
    cursor: pointer;
  }
  .export-btn:hover{ background: var(--moss); color: #fff; }

  /* ---------- Category management ---------- */
  .cat-manage-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 7px 4px;
    border-bottom: 1px dashed var(--line);
    font-size: 13.5px;
  }
  .cat-manage-row input[type=text]{
    flex:1;
    border:none;
    background:none;
    font-family:'Source Serif 4', serif;
    font-size: 13.5px;
    color: var(--ink);
    padding: 2px;
  }
  .cat-manage-row input[type=text]:focus{ outline: 1px solid var(--moss); }
  .cat-manage-row button{
    background:none; border:none; cursor:pointer; color: var(--ink-soft); font-size: 13px; padding: 0 4px;
  }
  .cat-manage-row button:hover{ color: var(--weapon); }
  .add-cat-row{
    display:flex;
    gap: 6px;
    margin-top: 10px;
  }
  .add-cat-row input[type=text]{
    flex:1;
    padding: 7px 8px;
    border: 1px solid var(--line);
    font-family:'Source Serif 4', serif;
    font-size: 13.5px;
    background:#fff;
  }
  .add-cat-row button{
    background: var(--moss-deep);
    color:#fff;
    border:none;
    padding: 0 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor:pointer;
  }
  .manage-toggle-link{
    background:none; border:none; text-decoration:underline; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; color: var(--ink-soft); font-size:11px; padding:0; margin-top:10px; display:block;
  }

  /* ---------- Kyobo link ---------- */
  .kyobo-link{
    display:inline-flex;
    align-items:center;
    gap: 4px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid var(--gold-soft);
    width: fit-content;
  }
  .kyobo-link:hover{ color: var(--moss-deep); border-color: var(--moss); }

  /* ---------- Main ---------- */
  main{ padding: 28px 32px 60px; }

  .search-card{
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    padding: 20px;
    margin-bottom: 28px;
  }
  .search-row{
    display:flex;
    gap: 10px;
  }
  .search-row input[type=text]{
    flex:1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-family:'Source Serif 4', serif;
    font-size: 16px;
    color: var(--ink);
  }
  .search-row input[type=text]:focus{ outline: 2px solid var(--moss); outline-offset: 1px; }
  .search-row button{
    background: var(--moss-deep);
    color: #fff;
    border: none;
    padding: 0 22px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    cursor:pointer;
  }
  .search-row button:hover{ background: var(--moss); }
  .search-row button:disabled{ background: var(--line); cursor:default; }

  .search-results{
    margin-top: 14px;
    display:grid;
    gap: 10px;
  }
  .result-row{
    display:flex;
    gap: 12px;
    padding: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    cursor:pointer;
    align-items:center;
  }
  .result-row:hover{ border-color: var(--moss); }
  .result-row img{ width: 40px; height: 58px; object-fit: cover; background: var(--paper-deep); flex-shrink:0; }
  .result-row .meta b{ display:block; font-size: 14.5px; }
  .result-row .meta span{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
  .no-result-hint{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 10px;
    font-family:'IBM Plex Mono', monospace;
  }
  .manual-add-link{
    background:none; border:none; text-decoration:underline; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; color: var(--moss-deep); font-size:12.5px; padding:0;
  }

  /* ---------- Entry form (appears after pick) ---------- */
  .entry-form{
    margin-top: 18px;
    border-top: 1px dashed var(--line);
    padding-top: 18px;
    display:grid;
    grid-template-columns: 90px 1fr;
    gap: 14px;
  }
  .entry-form .cover img{ width:90px; height:130px; object-fit:cover; border:1px solid var(--line); background:var(--paper-deep); }
  .form-fields{ display:grid; gap: 10px; }
  .form-fields label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    display:block;
    margin-bottom: 3px;
  }
  .form-fields input[type=text], .form-fields select, .form-fields textarea{
    width:100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    background: #fff;
    font-family:'Source Serif 4', serif;
    font-size: 14.5px;
    color: var(--ink);
  }
  .field-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tag-toggle{ display:flex; gap:8px; }
  .tag-toggle button{
    flex:1;
    padding: 9px;
    border: 1px solid var(--line);
    background: #fff;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    cursor:pointer;
    color: var(--ink-soft);
  }
  .tag-toggle button.on-seed{ background: var(--seed); color:#fff; border-color: var(--seed); }
  .tag-toggle button.on-weapon{ background: var(--weapon); color:#fff; border-color: var(--weapon); }
  .tag-toggle button.on-life{ background: var(--life); color:#fff; border-color: var(--life); }
  .save-row{ display:flex; gap:10px; margin-top: 4px; }
  .save-row button{
    padding: 10px 20px;
    border:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    cursor:pointer;
  }
  .btn-save{ background: var(--gold); color: #2b2110; }
  .btn-save:hover{ background: #937135; }
  .btn-cancel{ background: none; border: 1px solid var(--line); color: var(--ink-soft); }

  /* ---------- Book list ---------- */
  .list-header{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
  }
  .list-header h2{ margin:0; font-size: 20px; }
  .list-header .num{ font-family:'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); }

  .book-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .book-card{
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: var(--card-shadow);
    padding: 14px;
    position: relative;
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .book-card .top-row{ display:flex; gap:10px; }
  .book-card img{ width:52px; height:74px; object-fit:cover; background:var(--paper-deep); flex-shrink:0; }
  .book-card .titles{ flex:1; min-width:0; }
  .book-card .titles .t{ font-size: 15.5px; font-weight: 600; line-height:1.3; }
  .book-card .titles .a{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); margin-top:3px; }
  .book-card .cat-line{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--moss-deep);
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .book-card .tags{ display:flex; gap:6px; }
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    color:#fff;
  }
  .badge.seed{ background: var(--seed); }
  .badge.weapon{ background: var(--weapon); }
  .badge.life{ background: var(--life); }
  .card-actions{
    position:absolute;
    top: 10px;
    right: 10px;
    display:flex;
    gap: 6px;
  }
  .card-actions button{
    background:none;
    border:none;
    cursor:pointer;
    color: var(--ink-soft);
    font-size: 13px;
  }
  .card-actions button:hover{ color: var(--weapon); }

  .empty-state{
    padding: 50px 20px;
    text-align:center;
    color: var(--ink-soft);
    border: 1px dashed var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13.5px;
  }

  .loading-dot{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">MY SEED &amp; WEAPON LIBRARY</p>
  <h1>씨앗 · 무기 도서 목록</h1>
  <p class="sub">제목을 검색하면 저자·출판사 정보를 자동으로 불러옵니다. 카테고리와 씨앗/무기 태그는 직접 골라 100권, 그 이상까지 쌓아보세요.</p>
  <div class="count-strip" id="countStrip"></div>
</header>

<div class="layout">
  <aside class="drawer">
    <h2>분류 (교보문고 대분류 기준)</h2>
    <div id="categoryList"></div>
    <button class="manage-toggle-link" id="toggleManage">+ 카테고리 직접 편집</button>
    <div id="categoryManage" style="display:none;"></div>

    <h2 style="margin-top:24px;">태그</h2>
    <div class="tag-filter">
      <button class="pill" id="filterSeed">🌱 씨앗</button>
      <button class="pill" id="filterWeapon">⚔️ 무기</button>
      <button class="pill" id="filterLife">⭐ 인생</button>
      <button class="pill" id="filterClear">전체</button>
    </div>

    <button class="export-btn" id="exportBtn">CSV로 내보내기</button>
  </aside>

  <main>
    <div class="search-card">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="책 제목을 입력하세요 (예: 사피엔스)">
        <button id="searchBtn">검색</button>
      </div>
      <div id="searchStatus"></div>
      <div class="search-results" id="searchResults"></div>
      <div id="manualAddWrap"></div>
      <div id="entryFormWrap"></div>
    </div>

    <div class="list-header">
      <h2 id="listTitle">전체 목록</h2>
      <span class="num" id="listCount"></span>
    </div>
    <div id="bookGrid" class="book-grid"></div>
  </main>
</div>

<script>
// 클로드 아티팩트 환경이 아니라 로컬 브라우저에서 이 파일을 직접 열었을 때를 위한 폴백 저장소.
// window.storage가 이미 있으면(클로드 안에서 열었을 때) 그걸 그대로 쓰고,
// 없으면(내 컴퓨터에서 바로 열었을 때) localStorage로 동일하게 동작하게 만듭니다.
if (typeof window.storage === 'undefined') {
  const NS = 'seedweapon:';
  window.storage = {
    async get(key, shared){
      const v = localStorage.getItem(NS + key);
      if (v === null) throw new Error('key not found: ' + key);
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(NS + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem(NS + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const p = NS + (prefix || '');
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith(p))
        .map(k => k.slice(NS.length));
      return { keys, prefix, shared: !!shared };
    }
  };
}

const DEFAULT_CATEGORIES = [
  "문학의 뿌리 (소설, 시/에세이)",
  "사고의 틀 (인문, 철학)",
  "세상 읽기 (정치/사회, 역사/문화)",
  "일과 전략 (경제/경영, 자기계발)",
  "과학과 미래 (과학, 기술/공학, 컴퓨터/IT)",
  "예술과 감각 (예술/대중문화)",
  "믿음과 존재 (종교)",
  "삶의 기술 (건강, 요리, 가정/육아, 취미/실용/스포츠, 여행)",
  "미분류"
];

// 예전 버전에서 이미 저장해둔 카테고리명 → 새 표기(교보문고 대응 분류 포함)로 자동 이전
const CATEGORY_RENAME_MAP = {
  "문학의 뿌리": "문학의 뿌리 (소설, 시/에세이)",
  "사고의 틀 (인문)": "사고의 틀 (인문, 철학)",
  "세상 읽기": "세상 읽기 (정치/사회, 역사/문화)",
  "일과 전략": "일과 전략 (경제/경영, 자기계발)",
  "과학과 미래": "과학과 미래 (과학, 기술/공학, 컴퓨터/IT)",
  "예술과 감각": "예술과 감각 (예술/대중문화)",
  "믿음과 존재": "믿음과 존재 (종교)",
  "삶의 기술": "삶의 기술 (건강, 요리, 가정/육아, 취미/실용/스포츠, 여행)"
};

let categories = [...DEFAULT_CATEGORIES];
let books = [];
let activeCategory = "전체";
let activeTagFilter = null; // 'seed' | 'weapon' | null
let pendingPick = null; // book data chosen from search, before saving
let editingBookId = null; // set when editing an existing book instead of adding new

const STORAGE_KEY_PREFIX = "book:";
const LIST_INDEX_KEY = "book-index";
const CATEGORIES_KEY = "categories-list";

function kyoboLink(title){
  return `https://search.kyobobook.co.kr/search?keyword=${encodeURIComponent(title)}`;
}

async function loadCategories(){
  try{
    const r = await window.storage.get(CATEGORIES_KEY);
    categories = r ? JSON.parse(r.value) : [...DEFAULT_CATEGORIES];
  }catch(e){
    categories = [...DEFAULT_CATEGORIES];
  }
  let migrated = false;
  categories = categories.map(c=>{
    if(CATEGORY_RENAME_MAP[c] && CATEGORY_RENAME_MAP[c] !== c){
      migrated = true;
      return CATEGORY_RENAME_MAP[c];
    }
    return c;
  });
  if(migrated) await saveCategories();
}

async function saveCategories(){
  await window.storage.set(CATEGORIES_KEY, JSON.stringify(categories));
}

async function loadBooks(){
  await loadCategories();
  try{
    const idxRes = await window.storage.get(LIST_INDEX_KEY);
    const ids = idxRes ? JSON.parse(idxRes.value) : [];
    const loaded = [];
    for(const id of ids){
      try{
        const r = await window.storage.get(STORAGE_KEY_PREFIX + id);
        if(r) loaded.push(JSON.parse(r.value));
      }catch(e){ /* skip missing */ }
    }
    // 이전 카테고리명으로 저장된 책이 있으면 새 표기로 함께 갱신
    for(const b of loaded){
      if(CATEGORY_RENAME_MAP[b.category] && CATEGORY_RENAME_MAP[b.category] !== b.category){
        b.category = CATEGORY_RENAME_MAP[b.category];
        await window.storage.set(STORAGE_KEY_PREFIX + b.id, JSON.stringify(b));
      }
    }
    books = loaded.sort((a,b)=> b.createdAt - a.createdAt);
  }catch(e){
    books = [];
  }
  render();
}

async function saveIndex(){
  const ids = books.map(b=>b.id);
  await window.storage.set(LIST_INDEX_KEY, JSON.stringify(ids));
}

async function saveBook(book){
  await window.storage.set(STORAGE_KEY_PREFIX + book.id, JSON.stringify(book));
  books.unshift(book);
  await saveIndex();
  render();
}

async function deleteBook(id){
  await window.storage.delete(STORAGE_KEY_PREFIX + id);
  books = books.filter(b=>b.id !== id);
  await saveIndex();
  render();
}

function renderCategoryList(){
  const wrap = document.getElementById('categoryList');
  wrap.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'cat-btn' + (activeCategory === '전체' ? ' active' : '');
  all.innerHTML = `<span>전체보기</span><span class="n">${books.length}</span>`;
  all.onclick = ()=>{ activeCategory='전체'; render(); };
  wrap.appendChild(all);

  categories.forEach(cat=>{
    const n = books.filter(b=>b.category===cat).length;
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (activeCategory===cat ? ' active':'');
    btn.innerHTML = `<span>${cat}</span><span class="n">${n}</span>`;
    btn.onclick = ()=>{ activeCategory=cat; render(); };
    wrap.appendChild(btn);
  });
}

function renderCategoryManage(){
  const wrap = document.getElementById('categoryManage');
  wrap.innerHTML = '';
  categories.forEach((cat, idx)=>{
    const row = document.createElement('div');
    row.className = 'cat-manage-row';
    row.innerHTML = `
      <input type="text" value="${escapeAttr(cat)}" data-idx="${idx}">
      <button data-del="${idx}" title="삭제">✕</button>
    `;
    row.querySelector('input').addEventListener('change', async (e)=>{
      const newName = e.target.value.trim();
      if(!newName) { e.target.value = cat; return; }
      if(newName === cat) return;
      const oldName = categories[idx];
      categories[idx] = newName;
      await saveCategories();
      // 기존 책들에 붙은 이전 카테고리명도 함께 갱신
      for(const b of books){
        if(b.category === oldName){
          b.category = newName;
          await window.storage.set(STORAGE_KEY_PREFIX + b.id, JSON.stringify(b));
        }
      }
      if(activeCategory === oldName) activeCategory = newName;
      render();
    });
    row.querySelector('[data-del]').onclick = async ()=>{
      if(categories.length <= 1){ alert('카테고리가 최소 1개는 있어야 합니다.'); return; }
      const removed = categories[idx];
      const fallback = categories.find(c=>c!==removed) || '미분류';
      categories = categories.filter((_,i)=>i!==idx);
      await saveCategories();
      for(const b of books){
        if(b.category === removed){
          b.category = fallback;
          await window.storage.set(STORAGE_KEY_PREFIX + b.id, JSON.stringify(b));
        }
      }
      if(activeCategory === removed) activeCategory = '전체';
      render();
    };
    wrap.appendChild(row);
  });

  const addRow = document.createElement('div');
  addRow.className = 'add-cat-row';
  addRow.innerHTML = `<input type="text" id="newCatInput" placeholder="새 카테고리 이름"><button id="addCatBtn">추가</button>`;
  wrap.appendChild(addRow);
  document.getElementById('addCatBtn').onclick = async ()=>{
    const input = document.getElementById('newCatInput');
    const val = input.value.trim();
    if(!val) return;
    if(categories.includes(val)){ input.value=''; return; }
    categories.push(val);
    await saveCategories();
    input.value = '';
    render();
  };
}

function renderCountStrip(){
  const seedCount = books.filter(b=>b.tags.includes('seed')).length;
  const weaponCount = books.filter(b=>b.tags.includes('weapon')).length;
  const lifeCount = books.filter(b=>b.tags.includes('life')).length;
  document.getElementById('countStrip').innerHTML = `
    <div class="item"><b>${books.length}</b>전체 등록</div>
    <div class="item"><b>${seedCount}</b>🌱 씨앗도서</div>
    <div class="item"><b>${weaponCount}</b>⚔️ 무기도서</div>
    <div class="item"><b>${lifeCount}</b>⭐ 인생도서</div>
    <div class="item"><b>${Math.max(0,100-books.length)}</b>100권까지 남음</div>
  `;
}

function renderList(){
  let filtered = books;
  if(activeCategory !== '전체') filtered = filtered.filter(b=>b.category===activeCategory);
  if(activeTagFilter) filtered = filtered.filter(b=>b.tags.includes(activeTagFilter));

  document.getElementById('listTitle').textContent = activeCategory === '전체' ? '전체 목록' : activeCategory;
  document.getElementById('listCount').textContent = `${filtered.length}권`;

  const grid = document.getElementById('bookGrid');
  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">아직 등록된 책이 없습니다. 위에서 제목을 검색해 첫 권을 추가해보세요.</div>`;
    return;
  }
  grid.innerHTML = '';
  filtered.forEach(b=>{
    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      <div class="card-actions">
        <button title="수정" data-edit="${b.id}">✎</button>
        <button title="삭제" data-id="${b.id}">✕</button>
      </div>
      <div class="top-row">
        ${b.thumbnail ? `<img src="${b.thumbnail}">` : `<div style="width:52px;height:74px;background:var(--paper-deep);"></div>`}
        <div class="titles">
          <div class="t">${escapeHtml(b.title)}</div>
          <div class="a">${escapeHtml(b.author || '저자 미상')} · ${escapeHtml(b.publisher || '출판사 미상')}</div>
        </div>
      </div>
      <div class="tags">
        ${b.tags.includes('seed') ? '<span class="badge seed">🌱 씨앗</span>' : ''}
        ${b.tags.includes('weapon') ? '<span class="badge weapon">⚔️ 무기</span>' : ''}
        ${b.tags.includes('life') ? '<span class="badge life">⭐ 인생</span>' : ''}
      </div>
      <div class="cat-line">${escapeHtml(b.category)}</div>
      ${b.note ? `<div style="font-size:12.5px;color:var(--ink-soft);">${escapeHtml(b.note)}</div>` : ''}
      <a class="kyobo-link" href="${kyoboLink(b.title)}" target="_blank" rel="noopener">교보문고에서 보기 ↗</a>
    `;
    card.querySelector('[data-id]').onclick = ()=> deleteBook(b.id);
    card.querySelector('[data-edit]').onclick = ()=> startEditBook(b);
    grid.appendChild(card);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function render(){
  renderCategoryList();
  renderCategoryManage();
  renderCountStrip();
  renderList();
}

document.getElementById('toggleManage').onclick = ()=>{
  const panel = document.getElementById('categoryManage');
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'block' : 'none';
  document.getElementById('toggleManage').textContent = isHidden ? '− 카테고리 편집 닫기' : '+ 카테고리 직접 편집';
};

// ---------- Search (Google Books API) ----------
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchStatus = document.getElementById('searchStatus');
const searchResults = document.getElementById('searchResults');
const manualAddWrap = document.getElementById('manualAddWrap');
const entryFormWrap = document.getElementById('entryFormWrap');

searchBtn.onclick = doSearch;
searchInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSearch(); });

async function doSearch(){
  const q = searchInput.value.trim();
  if(!q) return;
  searchResults.innerHTML = '';
  manualAddWrap.innerHTML = '';
  entryFormWrap.innerHTML = '';
  pendingPick = null;
  searchBtn.disabled = true;
  searchStatus.innerHTML = `<div class="loading-dot">검색 중...</div>`;

  try{
    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent('intitle:' + q)}&maxResults=8&key=AIzaSyAukejXbh7C1DyOPPWewGByep5zH3JP6kI`);
    const data = await res.json();
    searchStatus.innerHTML = '';
    const items = (data.items || []).filter(it => it.volumeInfo && it.volumeInfo.title);

    if(items.length === 0){
      searchResults.innerHTML = '';
      showManualAddPrompt(q);
    } else {
      items.forEach(it=>{
        const info = it.volumeInfo;
        const row = document.createElement('div');
        row.className = 'result-row';
        const thumb = info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail) : '';
        row.innerHTML = `
          ${thumb ? `<img src="${thumb}">` : `<div style="width:40px;height:58px;background:var(--paper-deep);"></div>`}
          <div class="meta">
            <b>${escapeHtml(info.title)}</b>
            <span>${escapeHtml((info.authors||['저자 미상']).join(', '))} · ${escapeHtml(info.publisher || '출판사 미상')}${info.publishedDate ? ' · ' + info.publishedDate.slice(0,4) : ''}</span>
          </div>
          <a class="kyobo-link" href="${kyoboLink(info.title)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">교보 ↗</a>
        `;
        row.onclick = ()=>{
          pendingPick = {
            title: info.title,
            author: (info.authors||[]).join(', '),
            publisher: info.publisher || '',
            thumbnail: thumb ? thumb.replace('http://','https://') : ''
          };
          searchResults.innerHTML = '';
          manualAddWrap.innerHTML = '';
          showEntryForm(pendingPick);
        };
        searchResults.appendChild(row);
      });
      const hint = document.createElement('div');
      hint.className = 'no-result-hint';
      hint.innerHTML = `찾는 책이 없나요? <button class="manual-add-link" id="manualLinkAfter">직접 입력하기</button>`;
      searchResults.appendChild(hint);
      document.getElementById('manualLinkAfter').onclick = ()=> showManualAddPrompt(q);
    }
  }catch(e){
    searchStatus.innerHTML = '';
    searchResults.innerHTML = `<div class="no-result-hint">검색 중 오류가 발생했습니다. 네트워크를 확인하거나 직접 입력해 주세요.</div>`;
    showManualAddPrompt(q);
  }
  searchBtn.disabled = false;
}

function showManualAddPrompt(prefillTitle){
  manualAddWrap.innerHTML = `<div class="no-result-hint">검색 결과가 없습니다. <button class="manual-add-link" id="manualBtn">직접 입력해서 추가</button></div>`;
  document.getElementById('manualBtn').onclick = ()=>{
    manualAddWrap.innerHTML = '';
    showEntryForm({ title: prefillTitle, author:'', publisher:'', thumbnail:'' });
  };
}

function showEntryForm(pick){
  const isEdit = !!editingBookId;
  const initialTags = pick.tags || [];
  entryFormWrap.innerHTML = `
    <div class="entry-form">
      <div class="cover">
        ${pick.thumbnail ? `<img src="${pick.thumbnail}">` : `<div style="width:90px;height:130px;background:var(--paper-deep);"></div>`}
      </div>
      <div class="form-fields">
        <div class="field-row">
          <div>
            <label>제목</label>
            <input type="text" id="f_title" value="${escapeAttr(pick.title)}">
          </div>
          <div>
            <label>저자</label>
            <input type="text" id="f_author" value="${escapeAttr(pick.author)}">
          </div>
        </div>
        <div class="field-row">
          <div>
            <label>출판사</label>
            <input type="text" id="f_publisher" value="${escapeAttr(pick.publisher)}">
          </div>
          <div>
            <label>분류</label>
            <select id="f_category">
              ${categories.map(c=>`<option value="${escapeAttr(c)}" ${pick.category===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
        </div>
        <div>
          <label>태그</label>
          <div class="tag-toggle">
            <button type="button" id="toggleSeed">🌱 씨앗도서</button>
            <button type="button" id="toggleWeapon">⚔️ 무기도서</button>
            <button type="button" id="toggleLife">⭐ 인생도서</button>
          </div>
        </div>
        <div>
          <label>메모 (왜 이 책을 골랐는지)</label>
          <textarea id="f_note" rows="2" placeholder="이 책을 씨앗/무기로 고른 이유를 짧게 적어보세요.">${escapeHtml(pick.note||'')}</textarea>
        </div>
        <a class="kyobo-link" id="f_kyoboLink" href="${kyoboLink(pick.title)}" target="_blank" rel="noopener">교보문고에서 확인 ↗</a>
        <div class="save-row">
          <button class="btn-save" id="saveBookBtn">${isEdit ? '수정 저장' : '목록에 추가'}</button>
          <button class="btn-cancel" id="cancelBookBtn">취소</button>
        </div>
      </div>
    </div>
  `;

  let tags = [...initialTags];
  const seedBtn = document.getElementById('toggleSeed');
  const weaponBtn = document.getElementById('toggleWeapon');
  const lifeBtn = document.getElementById('toggleLife');
  if(tags.includes('seed')) seedBtn.classList.add('on-seed');
  if(tags.includes('weapon')) weaponBtn.classList.add('on-weapon');
  if(tags.includes('life')) lifeBtn.classList.add('on-life');
  seedBtn.onclick = ()=>{
    tags = tags.includes('seed') ? tags.filter(t=>t!=='seed') : [...tags, 'seed'];
    seedBtn.classList.toggle('on-seed');
  };
  weaponBtn.onclick = ()=>{
    tags = tags.includes('weapon') ? tags.filter(t=>t!=='weapon') : [...tags, 'weapon'];
    weaponBtn.classList.toggle('on-weapon');
  };
  lifeBtn.onclick = ()=>{
    tags = tags.includes('life') ? tags.filter(t=>t!=='life') : [...tags, 'life'];
    lifeBtn.classList.toggle('on-life');
  };

  // 제목을 직접 고치면 교보 링크도 함께 갱신
  document.getElementById('f_title').addEventListener('input', (e)=>{
    document.getElementById('f_kyoboLink').href = kyoboLink(e.target.value.trim() || pick.title);
  });

  document.getElementById('cancelBookBtn').onclick = ()=>{
    entryFormWrap.innerHTML = '';
    searchResults.innerHTML = '';
    manualAddWrap.innerHTML = '';
    editingBookId = null;
  };

  document.getElementById('saveBookBtn').onclick = async ()=>{
    const bookData = {
      id: isEdit ? editingBookId : ('b_' + Date.now() + '_' + Math.random().toString(36).slice(2,7)),
      title: document.getElementById('f_title').value.trim() || '제목 없음',
      author: document.getElementById('f_author').value.trim(),
      publisher: document.getElementById('f_publisher').value.trim(),
      category: document.getElementById('f_category').value,
      thumbnail: pick.thumbnail || '',
      note: document.getElementById('f_note').value.trim(),
      tags,
      createdAt: isEdit ? pick.createdAt : Date.now()
    };
    try{
      if(isEdit){
        await updateBook(bookData);
      } else {
        await saveBook(bookData);
      }
      entryFormWrap.innerHTML = '';
      searchResults.innerHTML = '';
      manualAddWrap.innerHTML = '';
      searchInput.value = '';
      editingBookId = null;
    }catch(e){
      alert('저장 중 오류가 발생했습니다. 다시 시도해 주세요.');
    }
  };
}

function startEditBook(book){
  editingBookId = book.id;
  window.scrollTo({top:0, behavior:'smooth'});
  searchResults.innerHTML = '';
  manualAddWrap.innerHTML = '';
  searchStatus.innerHTML = '';
  showEntryForm(book);
}

async function updateBook(book){
  await window.storage.set(STORAGE_KEY_PREFIX + book.id, JSON.stringify(book));
  const idx = books.findIndex(b=>b.id===book.id);
  if(idx !== -1) books[idx] = book;
  render();
}

function escapeAttr(s){
  return (s||'').replace(/"/g,'&quot;');
}

// ---------- Sidebar filters ----------
document.getElementById('filterSeed').onclick = ()=>{
  activeTagFilter = activeTagFilter==='seed' ? null : 'seed';
  updateFilterPills();
  render();
};
document.getElementById('filterWeapon').onclick = ()=>{
  activeTagFilter = activeTagFilter==='weapon' ? null : 'weapon';
  updateFilterPills();
  render();
};
document.getElementById('filterLife').onclick = ()=>{
  activeTagFilter = activeTagFilter==='life' ? null : 'life';
  updateFilterPills();
  render();
};
document.getElementById('filterClear').onclick = ()=>{
  activeTagFilter = null;
  updateFilterPills();
  render();
};
function updateFilterPills(){
  document.getElementById('filterSeed').className = 'pill' + (activeTagFilter==='seed' ? ' active-seed':'');
  document.getElementById('filterWeapon').className = 'pill' + (activeTagFilter==='weapon' ? ' active-weapon':'');
  document.getElementById('filterLife').className = 'pill' + (activeTagFilter==='life' ? ' active-life':'');
}

// ---------- Export ----------
document.getElementById('exportBtn').onclick = ()=>{
  const header = ['제목','저자','출판사','분류','씨앗','무기','인생','메모'];
  const rows = books.map(b=>[
    b.title, b.author, b.publisher, b.category,
    b.tags.includes('seed') ? 'O':'', b.tags.includes('weapon') ? 'O':'', b.tags.includes('life') ? 'O':'',
    (b.note||'').replace(/\n/g,' ')
  ]);
  const csv = [header, ...rows].map(r => r.map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF" + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '씨앗무기도서목록.csv';
  a.click();
  URL.revokeObjectURL(url);
};

loadBooks();
</script>
